<!DOCTYPE html>
<html lang="en-IE">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Something went wrong</title>
    <!-- Plain HTML on purpose: the error page must work even when the app itself can't start. -->
    <style>
        body { margin: 0; background: #f7f5ef; color: #1f2a24; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
        .bar { background: #1f4d3a; height: 64px; }
        .card { max-width: 560px; margin: 48px auto; padding: 28px; background: #fff; border: 1px solid #dfe5df; border-radius: 12px; }
        h1 { font-family: Georgia, serif; color: #1f4d3a; margin: 0 0 12px; font-size: 1.8rem; }
        a.btn { display: inline-block; margin-top: 8px; padding: 11px 20px; border-radius: 10px; background: #2f6b4f; color: #fff; text-decoration: none; font-weight: 600; }
        @media (max-width: 600px) { .card { margin: 24px 16px; } }
    </style>
</head>
<body>
    <div class="bar"></div>
    <div class="card">
        <h1>Sorry, something went wrong</h1>
        <p>Please try again in a minute. If you were paying, check your email before paying again - your booking may already have gone through.</p>
        <a class="btn" href="/">Back to home</a>
    </div>
</body>
</html>
